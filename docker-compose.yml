# Ardoise — production sur un seul hôte.
#   cp .env.example .env   # puis renseigner (voir docs/DEPLOIEMENT.md)
#   docker compose up -d --build
#
# Initialisation (une seule fois, après le premier démarrage) :
#   docker compose exec app php artisan key:generate --force   # si APP_KEY est vide
#   docker compose exec app php artisan migrate --force
#   docker compose exec app php artisan db:seed --force        # plans + superadmin
#   docker compose exec app php artisan tenants:migrate
#   docker compose exec app php artisan storage:link --force
#
# Variables .env attendues par ce fichier : DB_DATABASE, DB_PASSWORD, APP_PORT (optionnel).
# L'utilisateur MySQL est root : il doit pouvoir CREATE DATABASE (une base par école).

x-laravel: &laravel
  image: ardoise:latest
  build: .
  env_file: .env
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    DB_CONNECTION: mysql
    TENANT_DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: "3306"
    DB_USERNAME: root
    QUEUE_CONNECTION: database
  volumes:
    - storage:/var/www/html/storage
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy

services:
  app:
    <<: *laravel
    ports:
      - "${APP_PORT:-8080}:8080"   # placer un reverse proxy HTTPS devant (Caddy, Traefik, Nginx…)

  queue:
    <<: *laravel
    # ports et healthcheck de l'image sans objet pour ce service
    healthcheck:
      disable: true
    command: php artisan queue:work --tries=3 --max-time=3600
    stop_grace_period: 1h

  scheduler:
    <<: *laravel
    healthcheck:
      disable: true
    command: php artisan schedule:work

  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requis}
      MYSQL_DATABASE: ${DB_DATABASE:-ardoise_central}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql:
  storage:
