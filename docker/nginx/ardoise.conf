# Exemple de site Nginx pour Ardoise.
# - Docker : copié tel quel dans l'image (écoute 8080, php-fpm dans le même conteneur).
# - Classique : copier vers /etc/nginx/sites-available/, adapter server_name, root et fastcgi_pass
#   (unix:/run/php/php8.4-fpm.sock), passer en `listen 443 ssl` avec vos certificats.
server {
    listen 8080;
    # Domaine central + tous les sous-domaines d'écoles (DNS wildcard *.votredomaine)
    server_name .votredomaine;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    client_max_body_size 10M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Activer derrière HTTPS uniquement :
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Assets Vite (noms hachés) : cache long
    location /build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass app:9000;   # service « app » de docker-compose ; en classique : 127.0.0.1:9000 ou socket
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
