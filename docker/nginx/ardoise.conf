# Exemple de site Nginx pour Ardoise.
# - Docker : copié tel quel dans l'image (écoute 8080, php-fpm dans le même conteneur).
# - Classique : copier vers /etc/nginx/sites-available/, adapter server_name, root et fastcgi_pass
#   (unix:/run/php/php8.4-fpm.sock), passer en `listen 443 ssl` avec vos certificats.
server {
    listen 8080;
    # Serveur par défaut : accepte n'importe quel Host (domaine central, sous-domaines d'écoles,
    # *.onrender.com). Le routage multi-écoles est fait par Laravel (TENANCY_*).
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    client_max_body_size 10M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Activer derrière HTTPS uniquement :
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Compression des textes (HTML, JSON, JS, CSS, SVG) : divise par trois le poids transféré
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript text/javascript application/xml application/manifest+json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Icônes et image de partage : cache d'une semaine
    location ~ ^/(favicon\.(ico|svg)|apple-touch-icon\.png|icon-\d+\.png|og-image\.png|site\.webmanifest)$ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Assets Vite (noms hachés) : cache long
    location /build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        # PHP-FPM tourne dans le même conteneur (Render, docker compose) : 127.0.0.1.
        # Hors Docker : 127.0.0.1:9000 ou socket unix.
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
