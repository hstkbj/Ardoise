; Exemple hors Docker : alternative à la tâche cron `* * * * * php artisan schedule:run`.
; Utiliser l'un OU l'autre, jamais les deux.
[program:ardoise-scheduler]
command=php /var/www/ardoise/artisan schedule:work
directory=/var/www/ardoise
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/ardoise/storage/logs/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
