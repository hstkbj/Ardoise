; Exemple hors Docker : /etc/supervisor/conf.d/ardoise-worker.conf
; Adapter le chemin du projet et l'utilisateur, puis : supervisorctl reread && supervisorctl update
[program:ardoise-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/ardoise/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/ardoise
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/ardoise/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
